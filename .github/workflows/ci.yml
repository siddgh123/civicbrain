# =============================================================================
# CivicBrain CI (docs/08_TEST_PLAN.md §6). Runs on every push to main / phase branches and on PRs.
# Jobs: db · backend · frontend · ai · security.  A job whose component does not exist yet
# (before P0/P3/P6) prints a notice and passes; once the folder exists the job is mandatory.
# Third-party actions are pinned to full commit SHAs (tag in the comment). Trivy: the action and
# binary versions below are the known-safe ones from advisory GHSA-69fq-xp46-6x23 (March 2026).
# To update an action: check the release notes, then `git ls-remote https://github.com/<owner>/<repo> refs/tags/<tag>`.
# Nightly E2E + ZAP baseline + OWASP Dependency-Check are added in P10 as .github/workflows/nightly.yml.
# =============================================================================
name: CI

on:
  push:
    branches: [main, 'phase/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  db:
    name: Database (V1-V6 + R__ grants + SQL tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: civicbrain_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: psql client
        run: psql --version || (sudo apt-get update -q && sudo apt-get install -y -q postgresql-client)
      - name: Server is PostgreSQL 18 + PostGIS 3.6
        run: |
          psql -X -At -d postgres -c "SELECT version()"
          psql -X -At -d postgres -c "SHOW server_version_num" | grep -E '^18[0-9]{4}$'
          psql -X -At -d postgres -c "SELECT default_version FROM pg_available_extensions WHERE name = 'postgis'" | grep -E '^3\.6'
      - name: Migration copies are consistent (db/ vs flyway/ vs backend)
        run: bash scripts/ci/check-migrations.sh
      - name: Fresh build from flyway/ (as Flyway applies it) + SQL tests
        run: bash scripts/ci/db-tests.sh
        env:
          SOURCE: flyway
          DB: civicbrain_ci
      - name: Fresh build from db/ (pgAdmin copies) + SQL tests
        run: bash scripts/ci/db-tests.sh
        env:
          SOURCE: db
          DB: civicbrain_ci_db
      - name: E2E reset keeps reference data, database stays usable, guard refuses other DBs
        run: |
          set -euo pipefail
          psql -X -q -v ON_ERROR_STOP=1 -d postgres -c "DROP DATABASE IF EXISTS civicbrain_ci_e2e" -c "CREATE DATABASE civicbrain_ci_e2e TEMPLATE civicbrain_ci"
          psql -X -q -v ON_ERROR_STOP=1 -d civicbrain_ci_e2e -f db/tools/e2e_reset.sql
          counts="$(psql -X -At -d civicbrain_ci_e2e -c "SELECT (SELECT count(*) FROM wards)||'/'||(SELECT count(*) FROM roads)||'/'||(SELECT count(*) FROM complaints)||'/'||(SELECT count(*) FROM users)")"
          echo "wards/roads/complaints/users after reset: $counts"
          test "$counts" = "23/1113/0/0"
          SKIP_BUILD=1 DB=civicbrain_ci_e2e bash scripts/ci/db-tests.sh
          if out="$(psql -X -q -v ON_ERROR_STOP=1 -d civicbrain_ci -f db/tools/e2e_reset.sql 2>&1)"; then
            echo "e2e_reset.sql ran on a non-E2E database"; exit 1
          fi
          grep -q 'e2e_reset.sql refused' <<<"$out" || { echo "$out"; echo "e2e_reset.sql failed for another reason"; exit 1; }

  # ---------------------------------------------------------------------------
  backend:
    name: Backend (mvnw verify, Testcontainers, JaCoCo)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Does the backend exist yet?
        id: exists
        run: |
          if [ -f backend/pom.xml ]; then echo "present=true" >> "$GITHUB_OUTPUT"
          else echo "present=false" >> "$GITHUB_OUTPUT"; echo "::notice::backend/ not created yet (P0) - job skipped"; fi
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        if: steps.exists.outputs.present == 'true'
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: ./mvnw verify
        if: steps.exists.outputs.present == 'true'
        working-directory: backend
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp verify
      - name: Test reports
        if: failure() && steps.exists.outputs.present == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-test-reports
          path: |
            backend/target/surefire-reports/
            backend/target/failsafe-reports/
            backend/target/site/jacoco/
          retention-days: 7

  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend (lint, typecheck, vitest + coverage)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Does the frontend exist yet?
        id: exists
        run: |
          if [ -f frontend/package-lock.json ]; then echo "present=true" >> "$GITHUB_OUTPUT"
          elif [ -d frontend/src ]; then echo "::error::frontend/src exists but frontend/package-lock.json is not committed (docs/10 §2)"; exit 1
          else echo "present=false" >> "$GITHUB_OUTPUT"; echo "::notice::frontend/ not created yet (P0) - job skipped"; fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.exists.outputs.present == 'true'
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm ci, lint, typecheck, unit tests
        if: steps.exists.outputs.present == 'true'
        working-directory: frontend
        run: |
          npm ci --no-fund
          npm run lint
          npm run typecheck
          npm run test:coverage

  # ---------------------------------------------------------------------------
  ai:
    name: AI service (ruff, pytest)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      # settings read by ai-service (pydantic-settings) in integration tests
      DB_HOST: localhost
      DB_PORT: '5432'
      DB_NAME: civicbrain_ci_ai
      DB_TEST_NAME: civicbrain_ci_ai
      DB_AI_USER: civicbrain_ai
      DB_AI_PASSWORD: ci-ai-password
      CI_AI_PASSWORD: ci-ai-password
      # owner account for integration-test fixtures (tests/it insert rows the worker then reads)
      PG_ADMIN_USER: postgres
      PG_ADMIN_PASSWORD: postgres
      # fake, non-secret values for the remaining required settings (tests/conftest.py sets the same)
      AI_SERVICE_JWT_SECRET: dGVzdC1vbmx5LWFpLXNlcnZpY2Utand0LXNlY3JldC0zMmI=
      AI_API_HOST: 127.0.0.1
      AI_API_PORT: '8001'
      OSRM_URL: http://127.0.0.1:5000
      STORAGE_ROOT: /tmp/cb-test/storage
      MODELS_DIR: ${{ github.workspace }}/ai-service/models
      YOLO_WEIGHTS: ${{ github.workspace }}/ai-service/models/yolov8s_civicbrain.onnx
      TEXT_EMBEDDING_MODEL_DIR: ${{ github.workspace }}/ai-service/models/all-MiniLM-L6-v2
      WORKER_ID: ci-worker
      HF_HUB_OFFLINE: '1'
      CI: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Does the AI service exist yet?
        id: exists
        run: |
          if [ -d ai-service/tests ]; then echo "present=true" >> "$GITHUB_OUTPUT"
          else echo "present=false" >> "$GITHUB_OUTPUT"; echo "::notice::ai-service/tests not created yet (P0) - job skipped"; fi
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: steps.exists.outputs.present == 'true'
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: ai-service/requirements*.txt
      - name: Test database (same build as the db job)
        if: steps.exists.outputs.present == 'true'
        run: |
          psql --version || (sudo apt-get update -q && sudo apt-get install -y -q postgresql-client)
          DB=civicbrain_ci_ai bash scripts/ci/db-tests.sh
      - name: Install (CPU PyTorch first, so the CUDA wheels are not downloaded)
        if: steps.exists.outputs.present == 'true'
        working-directory: ai-service
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.14.0 torchvision==0.29.0 --index-url https://download.pytorch.org/whl/cpu \
            || echo "::warning::CPU wheels not found on download.pytorch.org - falling back to PyPI wheels"
          python -m pip install -r requirements-dev.txt
      - name: ruff + pytest (tests that need model files skip when the files are absent)
        if: steps.exists.outputs.present == 'true'
        working-directory: ai-service
        run: |
          python -m ruff check .
          python -m pytest -q

  # ---------------------------------------------------------------------------
  security:
    name: Security (gitleaks, Trivy, npm audit, pip-audit)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read   # gitleaks-action lists the PR's commits (403 on private repos without it)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks (secrets in the whole history)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}   # only needed if the repo belongs to a GitHub organization
          GITLEAKS_ENABLE_COMMENTS: 'false'
      - name: Trivy filesystem scan (known-safe action + binary)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0 (immutable release)
        with:
          version: v0.69.3
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          skip-dirs: data,gis,db,infra/osrm/data
      - name: npm audit (production dependencies)
        run: |
          if [ -f frontend/package-lock.json ]; then cd frontend && npm audit --omit=dev --audit-level=high
          else echo "::notice::no frontend/package-lock.json yet"; fi
      - name: pip-audit (every pinned package of the Windows lock file)
        run: pipx run pip-audit -r ai-service/requirements-win-py313.lock --no-deps --disable-pip --progress-spinner off
