# Profile e2e: the Playwright / smoke stack on civicbrain_e2e (start-all.ps1 -E2E sets DB_URL, Mailpit, `log`).
spring:
  flyway:
    user: ${PG_ADMIN_USER}
    password: ${PG_ADMIN_PASSWORD}

app:
  # docs/04_API_CONTRACT.md §11: Playwright and the smoke run from one IP; the smoke posts several complaints as one citizen
  rate-limits:
    ip-multiplier: 100
    complaint-user: { capacity: 100, period: 24h }
